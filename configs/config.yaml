project:
  seed: 42
  device: cuda
  output_dir: outputs
  weights_dir: weights

data:
  root: dataset
  images_dir: dataset/images
  train_csv: dataset/train.csv
  query_csv: dataset/test_query.csv
  gallery_csv: dataset/test_gallery.csv

  image_size: [224, 224]
  bbox_padding: 0.10
  val_ratio: 0.10

model:
  backbone: resnet50
  pretrained: true
  embedding_dim: 512
  pooling: gem
  neck: bnneck
  use_attributes: false
  attribute_columns: []

loss:
  id_loss: arcface
  arcface_scale: 30.0
  arcface_margin: 0.30
  label_smoothing: 0.1
  triplet_margin: 0.3
  triplet_weight: 1.0
  id_weight: 1.0
  center_weight: 0.0005

train:
  epochs: 40

  batch_size_p: 12
  batch_size_k: 4

  num_workers: 4
  lr: 0.00035
  weight_decay: 0.0005
  warmup_epochs: 5
  scheduler: cosine
  amp: true

  eval_every: 5

  early_stop_patience: 8

search:
  metric: cosine

  backend: torch
  top_k: 10
  reject_threshold: 0.35
